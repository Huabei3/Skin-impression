# 实验2: 只开启L*a*b*分支
model_name: 'MSCAN_lab'
modules:
  skin_region_attention:
    enabled: false
  color_space_branches:
    enabled: true
    branches:
      - 'rgb'
      - 'lab'
  skin_statistics:
    enabled: false
  multi_task:
    enabled: false
training:
  batch_size: 32
  epochs: 100
  lr: 1e-4
