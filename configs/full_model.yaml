# 实验3: 所有模块开启
model_name: 'MSCAN_full'
modules:
  skin_region_attention:
    enabled: true
    method: 'hsv_threshold'
  color_space_branches:
    enabled: true
    branches:
      - 'rgb'
      - 'lab'
  skin_statistics:
    enabled: true
    feature_dim: 64
  multi_task:
    enabled: true
    tasks:
      preference_score:
        enabled: true
        weight: 1.0
      preference_center:
        enabled: true
        weight: 0.5
training:
  batch_size: 32
  epochs: 100
  lr: 1e-4
